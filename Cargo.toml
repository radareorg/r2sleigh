[workspace]
resolver = "2"
members = [
    "crates/r2abi",
    "crates/r2il",
    "crates/r2image",
    "crates/r2s",
    "crates/r2s-tui",
    "crates/r2sleigh-lift",
    "crates/r2sleigh-cli",
    "crates/r2source",
    "crates/r2ssa",
    "crates/r2types",
    "crates/r2engine",
    "crates/r2dec",
    "crates/r2rewrite",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"
authors = ["radare2 contributors", "0verflowme"]
repository = "https://github.com/0verflowme/r2sleigh"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1.1", features = ["use-std"] }
thiserror = "2.0"
clap = { version = "4", features = ["derive"] }
libsla = "=1.2.0"
sleigh-config = "=1.0.1"
serde_json = "1"
hex = "0.4"
# One fixed hasher: a hashed map iterates and allocates the same way every run (D338).
rustc-hash = "2"
object = { version = "0.40", default-features = false, features = ["read", "std"] }
z3 = "0.21.0"
insta = "1"
# The golden tests' harness (crates/r2s/tests/golden.rs) and its diffs.
libtest-mimic = "0.8"
similar = "3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
# reedline and ratatui are on the one crossterm: one terminal library in the
# shell, not two (`cargo tree -i crossterm` shows one version).
reedline = "0.52"

[profile.dev]
# Line tables rather than full debug info. A backtrace still names the file and
# line, which is what anyone here reads; what goes is the variable-level detail
# a debugger would use, and nothing in this project's workflow uses it.
#
# The reason it is in the manifest rather than in each person's environment is
# that it was in each person's environment and that did not hold. Several
# worktrees build this workspace at once, and one that missed the setting grew a
# twelve gigabyte debug directory against three or four for the others, which is
# the difference between everyone building and everyone failing on a full disk.
# A setting every contributor must remember is a setting that is sometimes
# forgotten, and the cost of forgetting lands on whoever is building next.
debug = "line-tables-only"

[profile.release]
# Keep everyday release builds fast enough for local iteration and CI.
# Use `--profile dist` when a maximum-optimized distributable artifact is needed.
lto = false
codegen-units = 16
panic = "unwind"
strip = true

# Release code with symbols and line tables, for a sampling profiler
# (`samply record target/profiling/r2s ...`) or a flamegraph.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# A debug build whose variables a debugger can read. `[profile.dev]` keeps only
# line tables so that several worktrees of this workspace fit on one disk; this
# is what to build when a breakpoint has to show a value rather than a line.
[profile.debugger]
inherits = "dev"
debug = "full"

# The build every CI gate grades: optimised, so the gates fit in minutes, with
# the debug build's overflow checks and debug assertions kept, so an arithmetic
# overflow is still a panic the engine reports as that function's refusal
# rather than a wrapped value rendered as if it were proven.
[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# A release build that a sampling profiler and a debugger can read. The engine
# ships as a cdylib radare2 loads, so `sample`/`lldb` need its symbols kept.
[profile.probe]
inherits = "release"
strip = false
debug = "full"
opt-level = 1

# The spec compiler runs in every clean build: at -O3 the SLA compile takes 11-14 s
# for -O0's 29 s (audit B2). A global build-override costs more than it saves.
[profile.dev.package.sleigh-compiler]
opt-level = 3

[profile.dev.package.libsla-sys]
opt-level = 3

[profile.release.package.sleigh-compiler]
opt-level = 3

[profile.release.package.libsla-sys]
opt-level = 3

# The Sleigh crates are vendored (vendor/README.md): owned code, built from
# this tree, with the upstream commit each was taken from recorded there.
[patch.crates-io]
sleigh-config = { path = "vendor/sleigh-config" }
libsla = { path = "vendor/libsla" }
libsla-sys = { path = "vendor/libsla-sys" }
sleigh-compiler = { path = "vendor/sleigh-compiler" }

# The structural lints are measured rather than denied.
#
# There is more of this debt than one change can clear, so denying them would
# stop all work and warning on them would break `-D warnings` in CI. They are
# allowed here and re-enabled by `scripts/structure-report.sh`, which holds the
# counts and fails when one rises. `clippy.toml` sets the thresholds.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(dylint_lib, values(any()))"] }

[workspace.lints.clippy]
excessive_nesting = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
