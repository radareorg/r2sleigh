name: CI

on:
  push:
    branches: [master]
  # Every pull request, whatever its base: a stacked PR is graded against its parent branch.
  pull_request:
  merge_group:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  # `ci-on-request.yml` calls the whole pipeline for a base moved to master or a `full-ci` label.
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

# The jobs read the repository and nothing else: no job writes through the
# token, so it is granted read access to the contents alone.
permissions:
  contents: read

# A newer run of the same branch or PR cancels the older; a call from `ci-on-request.yml` is its
# workflow's own group, so it neither cancels nor is cancelled by a push's run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners: every job starts from a clean image, so nothing here
# depends on a machine someone has to keep alive. A CI build is never edited
# and rebuilt in place, so incremental artifacts are dead weight, and the
# workspace's test build does not fit the runner's disk with debug info on.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # The radare2 test binaries the certification gate reads, at the commit it
  # was last run against: the gate takes the first binaries in name order, so
  # a moving corpus would move the gate.
  TESTBINS_URL: https://github.com/radareorg/radare2-testbins
  TESTBINS_REF: 3bc992e70159372d999ef427b685091d9dc21fc1
  # A harness that stalls says where: the steps below that drive one run
  # under `timeout -s ABRT`, and the fault handler prints every thread's
  # stack when that signal lands.
  PYTHONFAULTHANDLER: 1

jobs:
  # ── What this run grades ────────────────────────────────────────────
  #
  # Every push runs the first tier: format, Clippy, tests (the golden files,
  # the census among them), Dylints, the build, certification, the radare2
  # differential, hostile input, source-gold. The second tier, both
  # equivalence ratchets, release timing against the base and the coverage
  # sweep (31 of 43 jobs, most of the runner-minutes), runs on master, nightly,
  # by hand, in the merge queue, on a pull request whose base is master (the
  # next to merge) or that carries the `full-ci` label, and when
  # `ci-on-request.yml` calls it. Every gate still runs before a merge; a
  # restack of a 30-PR stack queues 30 first tiers, not 1,290 jobs.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      full: ${{ steps.plan.outputs.full }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.full }}
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELED_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          full=true
          if [ "$EVENT" = pull_request ] && [ "$REQUESTED" != true ]; then
            [ "$BASE" = master ] || [ "$LABELED_FULL" = true ] || full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "full=$full ($EVENT, base ${BASE:-none}, requested ${REQUESTED:-false})" >> "$GITHUB_STEP_SUMMARY"

  # ── Quality checks (single compile pipeline) ───────────────────────
  quality:
    name: Format + Clippy + Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The image's preinstalled SDKs are not used here, and the workspace's
      # test build needs the room. Deleting them takes a minute and a half, so
      # it runs behind the steps that do not need the space yet.
      - name: Free disk
        run: |
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            >/dev/null 2>&1 &
      - uses: actions/checkout@v7
      - name: Install the toolchain the repository pins
        run: rustup toolchain install --profile minimal --component rustfmt,clippy
      # r2rewrite's rule proofs link Z3.
      - name: Install Z3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libz3-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Print versions
        run: |
          echo "rustc:      $(rustc --version)"
          echo "cargo:      $(cargo --version)"
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Structure (the debt may fall, never rise)
        run: bash scripts/structure-report.sh
      # --no-fail-fast, always: without it one crate's known failure hides
      # every failure after it. nextest runs every test binary's tests side by
      # side, where `cargo test` runs the binaries one after another; it does
      # not run doctests, so those run on their own.
      - name: Unit tests
        run: |
          df -h /
          cargo nextest run --workspace --all-features --no-fail-fast
          cargo test --workspace --all-features --doc --no-fail-fast

  # ── A vendored specification change brings lift evidence (ROADMAP D35, D28) ──
  #
  # A pull request changing a `.sinc`, `.slaspec` or `.pspec` under vendor/sleigh-config
  # fails unless it also changes an oracle case or an r2il::eval test of the lift.
  spec-evidence:
    name: Spec changes carry oracle evidence
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every changed specification has a lift test beside it
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/spec_evidence.py --base "$BASE"

  # ── A change adds or lengthens no run of more than two `//` lines (AGENTS.md, Comments) ──
  #
  # `long_comments` in the structure report counts the total, which a run lengthened by one line
  # does not move; this grades the diff against the pull request's base (its parent, in a stack).
  comment-runs:
    name: Comments stay one or two lines
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The gate's own tests
        run: python3 scripts/test_comment_runs.py
      - name: No run is added or lengthened
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/comment_runs.py --base "$BASE"

  # ── Every baseline source is in an equivalence shard (ROADMAP D43) ──
  #
  # A source with baseline records and no shard in either matrix is never graded (#292's
  # `atomics.c`). It reads the tree alone, so it needs no history.
  check-shards:
    name: Baseline sources are in shards
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The gate's own tests
        run: python3 scripts/test_check_shards.py
      - name: Every baseline source is in a shard, every shard source has records
        run: python3 scripts/check_shards.py

  # ── The repository's own lints (tools/dylints/r2sleigh_lints) ──────
  #
  # A crate that has cleared a rule denies it at its root, so a new
  # violation fails here: every crate denies entity_keyed_map
  # (doc/adr-one-ir.md), today's sites allowed by item with their debt named.
  # The other rules still warn while their debt is paid down.
  dylint:
    name: Dylint (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain the lints pin
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' tools/dylints/r2sleigh_lints/rust-toolchain)"
          rustup toolchain install "$channel" --profile minimal --component rustc-dev,llvm-tools-preview
          rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/dylints/r2sleigh_lints -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-dylint,dylint-link
      # The warning count is a ratchet held exactly: a rise fails, and so does a fall until
      # warning-baseline.txt is lowered with it. Colours are stripped before counting.
      - name: Every crate
        run: |
          set -o pipefail
          cargo dylint --path tools/dylints/r2sleigh_lints --workspace -- --all-features --lib --bins 2>&1 | tee dylint.log
          count=$(sed -E 's/\x1b\[[0-9;]*m//g' dylint.log | awk '/^warning: `[^`]*` \((lib|bin "[^"]*")\) generated [0-9]+ warnings?/ { for (i = 1; i < NF; i++) if ($i == "generated") n += $(i + 1) } END { print n + 0 }')
          baseline=$(cat tools/dylints/r2sleigh_lints/warning-baseline.txt)
          echo "Dylint warnings: $count (baseline $baseline)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt "$baseline" ]; then echo "::error::Dylint warnings rose from $baseline to $count"; exit 1; fi
          if [ "$count" -lt "$baseline" ]; then echo "::error::Dylint warnings fell to $count; lower warning-baseline.txt to it"; exit 1; fi

  # ── One build of the shell every gate grades ───────────────────────
  #
  # Built once, with the `ci` profile: optimised, so the gates fit in minutes,
  # with the debug build's overflow checks and assertions kept, so a panic is
  # still the function's refusal. Every gate below downloads this binary
  # instead of compiling its own.
  build:
    name: Build the shell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain the repository pins
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-shell
      - name: Build
        run: cargo build --profile ci -p r2s --features sleigh
      - uses: actions/upload-artifact@v7
        with:
          name: r2s
          path: target/ci/r2s
          retention-days: 1
          if-no-files-found: error
      # The same shell counting its allocations; only r2s, the leaf crate, rebuilds.
      - name: Build the counting shell
        run: |
          mkdir -p target/count
          cargo build --profile ci -p r2s --features sleigh,alloc-count
          cp target/ci/r2s target/count/r2s
      - uses: actions/upload-artifact@v7
        with:
          name: r2s-count
          path: target/count/r2s
          retention-days: 1
          if-no-files-found: error

  # ── Native certification gate ───────────────────────────────────────
  #
  # Every named function is rendered and the proof is read: a rendering may not
  # read what nothing wrote. radare2 is not run here, which is the point.
  capture-gate:
    name: Native Capture Certification Gate
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: r2s
          path: target/ci
      - run: chmod +x target/ci/r2s
      # radare2's own test corpus, its ELF directory alone; radare2 itself is
      # not run by this gate.
      - name: Fetch radare2's test binaries
        run: |
          set -eu
          dir="$RUNNER_TEMP/testbins"
          git init -q "$dir"
          git -C "$dir" remote add origin "$TESTBINS_URL"
          git -C "$dir" sparse-checkout set elf
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$TESTBINS_REF"
          git -C "$dir" checkout -q FETCH_HEAD
          test -d "$dir/elf"
      # No harness may drive the deleted plugin; the gate reads the proof line
      # by name; the DecBench backend files every function it is asked for.
      - name: Harness contracts
        run: |
          python3 scripts/test_certify_render.py
          python3 scripts/test_check_shards.py
          python3 scripts/test_stack_tip.py
          python3 scripts/test_census.py
          python3 scripts/test_audit_abi_rows.py
          python3 scripts/audit_abi_rows.py --cc gcc
          python3 scripts/test_compile_check.py
          python3 scripts/test_diff_r2.py
          python3 scripts/test_c_types.py
          python3 scripts/test_differential_truth.py
          python3 scripts/test_spec_evidence.py
          python3 scripts/test_upstream_drift.py
          python3 scripts/test_mutants_d75.py
          python3 scripts/test_scratch_void.py
          python3 scripts/test_void_soundness.py
          python3 scripts/mutants_d213.py --check
          python3 scripts/mutants_s31a.py --check
          python3 -m unittest tests/test_no_plugin.py
          python3 -m unittest discover -s tests/decbench -p 'test_*.py'
      - name: A rendering may not read what nothing wrote
        run: |
          python3 scripts/certify_render.py \
            --bins "$RUNNER_TEMP/testbins/elf" \
            --r2s target/ci/r2s \
            --limit 80 --functions 8

  # ── The radare2 differential (ROADMAP GT, P11) ─────────────────────
  #
  # The same commands through the radare2 release the judgments name and r2s,
  # over radare2's elf, mach0 and pe test binaries: a disagreement no entry of
  # scripts/diff_r2_judged.toml judges fails, and so does a rise in the values
  # only radare2 reports (scripts/diff_r2_baseline.json).
  diff-r2:
    name: radare2 Differential Gate
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: r2s
          path: target/ci
      - run: chmod +x target/ci/r2s
      # The release the table names, checked against the checksum the release published.
      - name: Install the pinned radare2
        env:
          RADARE2_DEB_SHA256: 7019eedc0e0e87d1f53d6b8f5fc62b898567679c5efdce7fbfc557c9e7655e90
        run: |
          set -eu
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("scripts/diff_r2_judged.toml", "rb"))["radare2"])')
          deb="$RUNNER_TEMP/radare2_${version}_amd64.deb"
          curl -fsSL -o "$deb" "https://github.com/radareorg/radare2/releases/download/$version/radare2_${version}_amd64.deb"
          echo "$RADARE2_DEB_SHA256  $deb" | sha256sum -c -
          sudo dpkg -i "$deb"
          sudo ldconfig
          radare2 -v
      - name: Fetch radare2's elf, mach0 and pe test binaries
        run: |
          set -eu
          dir="$RUNNER_TEMP/testbins"
          git init -q "$dir"
          git -C "$dir" remote add origin "$TESTBINS_URL"
          git -C "$dir" sparse-checkout set elf mach0 pe
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$TESTBINS_REF"
          git -C "$dir" checkout -q FETCH_HEAD
          test -d "$dir/elf" && test -d "$dir/mach0" && test -d "$dir/pe"
      - name: Every disagreement judged, no radare2-only value added
        run: |
          python3 scripts/diff_r2.py --no-build --r2 /usr/bin/radare2 --r2s target/ci/r2s \
            --bins "$RUNNER_TEMP/testbins/elf" "$RUNNER_TEMP/testbins/mach0" "$RUNNER_TEMP/testbins/pe" \
            --jobs 4 --timeout 90 --verbose

  # ── Hostile input (ROADMAP H, D18) ───────────────────────────────
  #
  # radare2's fuzzed and PE test binaries, each opened and analysed under a
  # time and memory budget: a header that states more than the file holds
  # must cost no more than the file. The pdd budget is today's measure on
  # pe/65535sects.exe (one 14,189-instruction block); PF lowers it.
  hostile-gate:
    name: Hostile Input Gate
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: r2s
          path: target/ci
      - run: chmod +x target/ci/r2s
      - name: Fetch radare2's fuzzed and PE test binaries
        run: |
          set -eu
          dir="$RUNNER_TEMP/testbins"
          git init -q "$dir"
          git -C "$dir" remote add origin "$TESTBINS_URL"
          git -C "$dir" sparse-checkout set fuzzed pe
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$TESTBINS_REF"
          git -C "$dir" checkout -q FETCH_HEAD
          test -d "$dir/fuzzed" && test -d "$dir/pe"
      - name: afl on every file, 30 s and 512 MB each
        run: |
          python3 scripts/hostile_sweep.py --r2s target/ci/r2s --command afl \
            --seconds 30 --mb 512 "$RUNNER_TEMP/testbins/fuzzed" "$RUNNER_TEMP/testbins/pe"
      - name: pdd on every file, 120 s and 3 GB each
        run: |
          python3 scripts/hostile_sweep.py --r2s target/ci/r2s --command pdd \
            --seconds 120 --mb 3072 "$RUNNER_TEMP/testbins/fuzzed" "$RUNNER_TEMP/testbins/pe"

  # ── Release timing, against the base ───────────────────────────────
  #
  # The big functions timed on the base's build and this one's on the same
  # runner, so a quadratic pass fails here rather than in someone's session.
  # What every function renders is a golden file (tests/db/census), held in the
  # first tier.
  census:
    name: Timing vs Base
    runs-on: ubuntu-24.04
    needs: [plan, build]
    # A scheduled or manual run has no base to time against.
    if: needs.plan.outputs.full == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: r2s
          path: ${{ runner.temp }}/head
      - run: chmod +x "$RUNNER_TEMP/head/r2s"
      - name: Install the toolchain the repository pins
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-shell
      - name: Build the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -eu
          git worktree add -q "$RUNNER_TEMP/base-src" "$BASE"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo build --profile ci -p r2s --features sleigh \
            --manifest-path "$RUNNER_TEMP/base-src/Cargo.toml"
          mkdir -p "$RUNNER_TEMP/base"
          cp target/ci/r2s "$RUNNER_TEMP/base/r2s"
      - uses: actions/download-artifact@v8
        with:
          name: r2s-count
          path: ${{ runner.temp }}/head-count
      - name: Build the base's counting shell
        run: |
          set -eu
          chmod +x "$RUNNER_TEMP/head-count/r2s"
          mkdir -p "$RUNNER_TEMP/base-count"
          # A base from before the count has none, and head's count stands alone.
          if grep -q '^alloc-count' "$RUNNER_TEMP/base-src/crates/r2s/Cargo.toml"; then
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
              cargo build --profile ci -p r2s --features sleigh,alloc-count \
              --manifest-path "$RUNNER_TEMP/base-src/Cargo.toml"
            cp target/ci/r2s "$RUNNER_TEMP/base-count/r2s"
          fi
      - name: Fetch radare2's test binaries
        run: |
          set -eu
          dir="$RUNNER_TEMP/testbins"
          git init -q "$dir"
          git -C "$dir" remote add origin "$TESTBINS_URL"
          git -C "$dir" sparse-checkout set elf
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$TESTBINS_REF"
          git -C "$dir" checkout -q FETCH_HEAD
      - name: Release timing
        run: |
          set -o pipefail
          python3 scripts/census.py time --r2s "$RUNNER_TEMP/base/r2s" --r2s "$RUNNER_TEMP/head/r2s" \
            --count-r2s "$RUNNER_TEMP/base-count/r2s" --count-r2s "$RUNNER_TEMP/head-count/r2s" \
            --bins "$RUNNER_TEMP/testbins/elf" --runs 5 --budget 1.3 --rss-budget 1.1 \
            --alloc-budget 1.3 --heap-budget 1.05 | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Source-gold: graded against the source, not against another tool ──
  #
  # The same source compiled twice is exact ground truth for free. The debug
  # build says what every function really is and the stripped build is what the
  # engine has to work from, so recovery and soundness are measured rather than
  # asserted. Soundness is the number that matters: a decompiler that guesses
  # confidently is worse than one that says it does not know.
  source-gold:
    name: Source-Gold Correctness Gate
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: r2s
          path: target/ci
      - run: chmod +x target/ci/r2s
      - name: Grade the stripped build against the debug build
        run: |
          set -eu
          mkdir -p target/source-gold
          cc -g -O0 -o target/source-gold/debug tests/corpus/hashes.c
          strip -o target/source-gold/stripped target/source-gold/debug
          python3 scripts/differential_truth.py \
            --debug-build target/source-gold/debug \
            --stripped-build target/source-gold/stripped \
            --r2s target/ci/r2s \
            --baseline tests/gold/source_gold_baseline.json \
            --json target/source-gold/report.json
      # Whether a function returns a value at all: static helpers that leave scratch in the
      # result register, results no caller reads, a tail forwarder, an exported function.
      - name: Grade the return of each function against the source
        if: ${{ !cancelled() }}
        run: |
          set -eu
          mkdir -p target/source-gold
          gcc -g -O2 -o target/source-gold/returns_debug tests/gold/source_gold/returns.c
          strip -o target/source-gold/returns_stripped target/source-gold/returns_debug
          python3 scripts/differential_truth.py \
            --debug-build target/source-gold/returns_debug \
            --stripped-build target/source-gold/returns_stripped \
            --r2s target/ci/r2s \
            --baseline tests/gold/source_gold/returns_baseline.json \
            --json target/source-gold/returns.json
      # D203: a source-value function renders `void` only where tests/gold/scratch_void/known.txt names it, and a
      # void the baseline records stays void (doc/adr-scratch-result.md, S4).
      - name: Grade what each return leaves in the result register
        if: ${{ !cancelled() }}
        run: |
          set -eu
          mkdir -p target/source-gold
          gcc -g -O2 -fstack-protector-strong -o target/source-gold/scratch_debug tests/gold/source_gold/scratch.c
          gcc -g -O2 -o target/source-gold/returns_debug tests/gold/source_gold/returns.c
          gcc -g -O2 -o target/source-gold/clones_debug tests/gold/source_gold/clones.c
          for shape in scratch returns clones; do
            strip -o "target/source-gold/${shape}_stripped" "target/source-gold/${shape}_debug"
          done
          python3 scripts/scratch_void.py --r2s target/ci/r2s \
            --build scratch target/source-gold/scratch_debug target/source-gold/scratch_stripped \
            --build returns target/source-gold/returns_debug target/source-gold/returns_stripped \
            --build clones target/source-gold/clones_debug target/source-gold/clones_stripped \
            --known tests/gold/scratch_void/known.txt \
            --baseline tests/gold/scratch_void/ci_baseline.json \
            --json target/source-gold/scratch_void.json
      # A function whose result a caller reads is `void` only where tests/gold/void_soundness/known.json names its
      # build and a cause, each void at the base; every function of every build is judged (ROADMAP D213).
      - name: A read result is void only where the base renders it so, per build
        if: ${{ !cancelled() }}
        run: |
          set -eu
          mkdir -p target/source-gold
          python3 scripts/gen_void_adversaries.py --check
          python3 scripts/void_soundness.py --r2s target/ci/r2s --json target/source-gold/void_soundness.json
      # Shapes the gate once refused whole (exit 2): a function split by a cold abort(), a result that is a
      # function pointer, seven parameters, code the linker dropped. Clones and types whose ABI class the gate does
      # not state are named in the report and graded as nothing. Exit 1 is the engine's silent errors.
      - name: Read the shapes a real compiler makes
        if: ${{ !cancelled() }}
        run: |
          set -eu
          mkdir -p target/source-gold
          for shape in cold odd seven gcsect gclib clones abi enums krt statics; do
            flags="-g -O2"
            case "$shape" in gcsect|gclib) flags="$flags -ffunction-sections -Wl,--gc-sections" ;; esac
            case "$shape" in abi|krt) flags="$flags -std=gnu17" ;; esac
            gcc $flags -o "target/source-gold/${shape}_debug" "tests/gold/source_gold/${shape}.c"
            strip -o "target/source-gold/${shape}_stripped" "target/source-gold/${shape}_debug"
            status=0
            python3 scripts/differential_truth.py \
              --debug-build "target/source-gold/${shape}_debug" \
              --stripped-build "target/source-gold/${shape}_stripped" \
              --r2s target/ci/r2s \
              --json "target/source-gold/${shape}.json" > /dev/null || status=$?
            echo "$shape: exit $status"
            test "$status" -le 1
          done
      # -Wl,-x drops the FUNC symbols of static functions whose code stays loaded (fdat.c: in a section without X):
      # they count in the floor ungraded, so under a third is gradable. Exit 2 is the answer; 0 or 1 grades a sliver.
      - name: Refuse a build whose static functions lost their symbols
        if: ${{ !cancelled() }}
        run: |
          set -eu
          mkdir -p target/source-gold
          for shape in returns statics fdat; do
            gcc -g -O2 -Wl,-x -o "target/source-gold/${shape}_x" "tests/gold/source_gold/${shape}.c"
            strip -o "target/source-gold/${shape}_x_stripped" "target/source-gold/${shape}_x"
            status=0
            python3 scripts/differential_truth.py \
              --debug-build "target/source-gold/${shape}_x" \
              --stripped-build "target/source-gold/${shape}_x_stripped" \
              --r2s target/ci/r2s > /dev/null 2> "target/source-gold/${shape}_x.err" || status=$?
            cat "target/source-gold/${shape}_x.err"
            echo "$shape -Wl,-x: exit $status"
            test "$status" -eq 2
            grep -q "functions are gradable, under one in 3" "target/source-gold/${shape}_x.err"
          done
      # gcc -g1 keeps no prototype, type or parameter: the gate has no truth, and a guess that every function is
      # `void f(void)` is what it once graded. Exit 2 is the answer; exit 0, 1 or a crash (also 1) is the bug.
      - name: Refuse a debug build that states no signature
        if: ${{ !cancelled() }}
        run: |
          set -eu
          mkdir -p target/source-gold
          gcc -g1 -O2 -o target/source-gold/g1_debug tests/gold/source_gold/cold.c
          strip -o target/source-gold/g1_stripped target/source-gold/g1_debug
          status=0
          python3 scripts/differential_truth.py \
            --debug-build target/source-gold/g1_debug \
            --stripped-build target/source-gold/g1_stripped \
            --r2s target/ci/r2s > /dev/null 2> target/source-gold/g1.err || status=$?
          cat target/source-gold/g1.err
          echo "-g1: exit $status"
          test "$status" -eq 2
          grep -q "no function of the debug build is gradable" target/source-gold/g1.err
      # -fdebug-types-section moves types into type units: DWARF 4 numbers them in the offsets of .debug_info,
      # DWARF 5 leaves stubs. The reader refuses either build whole; exit 1 or 0 is the bug.
      - name: Refuse a debug build with type units
        if: ${{ !cancelled() }}
        run: |
          set -eu
          mkdir -p target/source-gold
          for build in "odd -gdwarf-4" "abi -gdwarf-5"; do
            set -- $build
            gcc -g -O2 -std=gnu17 "$2" -fdebug-types-section -o "target/source-gold/$1_types" "tests/gold/source_gold/$1.c"
            strip -o "target/source-gold/$1_types_stripped" "target/source-gold/$1_types"
            status=0
            python3 scripts/differential_truth.py \
              --debug-build "target/source-gold/$1_types" \
              --stripped-build "target/source-gold/$1_types_stripped" \
              --r2s target/ci/r2s > /dev/null 2> "target/source-gold/$1_types.err" || status=$?
            cat "target/source-gold/$1_types.err"
            echo "$1 $2 type units: exit $status"
            test "$status" -eq 2
            grep -q "a type unit (-fdebug-types-section)" "target/source-gold/$1_types.err"
          done
      - name: Archive the source-gold report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-gold-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/source-gold/report.json
            target/source-gold/void_soundness.json
            target/source-gold/returns.json
            target/source-gold/cold.json
            target/source-gold/odd.json
            target/source-gold/seven.json
            target/source-gold/gcsect.json
            target/source-gold/gclib.json
            target/source-gold/clones.json
            target/source-gold/abi.json
            target/source-gold/enums.json
            target/source-gold/krt.json
          if-no-files-found: warn

  # ── Equivalence: the harness's own tests ────────────────────────────
  #
  # The gate's self-tests and its pipeline over the stub shell. They need gcc
  # and x86-64 Linux, not the real shell, so they run beside the build.
  equivalence-harness:
    name: Equivalence Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: The harness's contracts, classifier, ratchet and builds
        run: |
          tests/equiv/bounded.sh 300 \
            test_equiv.AnswerStatusTests test_equiv.BatchTests test_equiv.BuildTests \
            test_equiv.ClassifyTests test_equiv.CompilerVerdictTests \
            test_equiv.ContractTests test_equiv.CostTests test_equiv.DwarfTests test_equiv.LoadedCodeTests \
            test_equiv.FunctionSymbolTests test_equiv.PlacementTests test_equiv.RangesTests \
            test_equiv.ReferenceTests test_equiv.RatchetTests

  # ── Equivalence ratchet ─────────────────────────────────────────────
  #
  # Every function of the corpus and the gold programs is decompiled from its
  # stripped build, compiled, and run against the original on the same inputs,
  # with UBSan and uninitialised-read builds beside it. The population is graded
  # in six shards, one per compiler and optimisation level, and the merge job
  # holds their union to the baseline: any change -- a function that stops
  # being equal, a refusal that stops producing a record, a failure for a new
  # reason, an improvement not yet blessed -- fails there until the baseline is
  # re-blessed with its cause. The merge job writes the proposed baseline as an
  # artifact, so a bless is read from this run, never from a laptop. The
  # baseline names the compilers it was blessed on (Ubuntu 24.04's gcc 13 and
  # clang 18, which this image carries); another toolchain is refused.
  equivalence-shard:
    name: Equivalence ${{ matrix.compiler }}-${{ matrix.opt }} ${{ matrix.part.name }}
    runs-on: ubuntu-24.04
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        opt: [O0, O1, O2]
        # Split by measured time, not record count (run 37137792784's
        # `timing:` lines): shapes.c alone takes 1.5 to 4.7 minutes per
        # configuration, more than the other seven together. The binaries of a
        # shard render side by side, so a shard lasts about as long as its
        # slowest binary. The merge job refuses if a baseline record goes
        # ungraded, so a new source file has to be added to one part here.
        part:
          - name: a
            sources: tests/corpus/branchy.c tests/corpus/hashes.c tests/corpus/values.c tests/gold/flag_materialisation.c tests/gold/review.c tests/gold/manual_limits.c tests/gold/code_pointer_table.c tests/gold/loop_carried.c tests/gold/atomics.c
          - name: shapes
            sources: tests/corpus/shapes.c
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: r2s
          path: target/ci
      - run: chmod +x target/ci/r2s
      - name: Print the compilers
        run: |
          gcc --version | head -n 1
          clang --version | head -n 1
      - name: Grade the shard
        run: |
          timeout -s ABRT 8m python3 tests/equiv/run_equiv.py \
            --r2s target/ci/r2s \
            --sources ${{ matrix.part.sources }} \
            --compilers ${{ matrix.compiler }} \
            --opts ${{ matrix.opt }} \
            --jobs 4 \
            --out "$RUNNER_TEMP/equiv"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: equiv-shard-${{ matrix.compiler }}-${{ matrix.opt }}-${{ matrix.part.name }}
          # The stripped binaries graded, so a moved record can be read locally.
          path: |
            ${{ runner.temp }}/equiv/records.json
            ${{ runner.temp }}/equiv/build/**/shown/*
          retention-days: 7
          if-no-files-found: error

  equivalence:
    name: Equivalence Ratchet
    runs-on: ubuntu-24.04
    needs: [plan, equivalence-shard]
    if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: equiv-shard-*
          path: ${{ runner.temp }}/shards
      - name: Hold every function to the baseline
        run: |
          python3 tests/equiv/merge_shards.py \
            --baseline tests/equiv/baseline.json \
            --out "$RUNNER_TEMP/equiv" \
            "$RUNNER_TEMP"/shards/*/records.json
      - name: Archive the records and the proposed baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: equivalence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/equiv/records.json
            ${{ runner.temp }}/equiv/baseline.proposed.json
          if-no-files-found: warn

  # The AArch64 shards install these packages from here: eighteen of them
  # fetching the same files from one mirror at once stalled it (2026-10-22), so
  # one job fetches the files, with its own tries, and the shards unpack them.
  # It also builds the qemu-aarch64 whose TCG plugin counts guest instructions
  # (D343): Ubuntu 24.04's qemu-user 8.2.2 has no -plugin.
  aarch64-toolchain:
    name: AArch64 toolchain packages
    runs-on: ubuntu-24.04
    needs: [plan]
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 20
    steps:
      - name: Cache qemu-aarch64 8.2.2 with plugins
        id: qemu
        uses: actions/cache@v4
        with:
          path: qemu
          key: qemu-8.2.2-aarch64-linux-user-plugins-ubuntu-24.04-v1
      - name: Build qemu-aarch64 8.2.2 with plugins
        if: steps.qemu.outputs.cache-hit != 'true'
        run: |
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20"
          for attempt in 1 2 3; do
            timeout -k 10 60 $apt update -qq &&
              timeout -k 10 180 $apt install --no-install-recommends -y ninja-build libglib2.0-dev zlib1g-dev python3-venv &&
              break
            [ "$attempt" = 3 ] && exit 1
          done
          curl -sSfL --retry 4 -o qemu.tar.xz https://download.qemu.org/qemu-8.2.2.tar.xz
          echo "847346c1b82c1a54b2c38f6edbd85549edeb17430b7d4d3da12620e2962bc4f3  qemu.tar.xz" | sha256sum -c
          tar xf qemu.tar.xz
          mkdir qemu-8.2.2/build && cd qemu-8.2.2/build
          ../configure --prefix="$GITHUB_WORKSPACE/qemu" --target-list=aarch64-linux-user \
            --enable-plugins --disable-system --disable-tools --disable-docs --disable-werror
          make -j"$(nproc)" qemu-aarch64
          make install
          "$GITHUB_WORKSPACE/qemu/bin/qemu-aarch64" -h | grep -- -plugin
      - name: Download the cross toolchain with its dependencies
        run: |
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20"
          hosts=(azure.archive.ubuntu.com archive.ubuntu.com mirrors.edge.kernel.org)
          for attempt in 1 2 3 4 5 6; do
            host=${hosts[$(( (attempt - 1) % 3 ))]}
            echo "try $attempt from $host"
            sudo sed -i -E "s#(mirror\+file:/etc/apt/apt-mirrors\.txt|https?://(([a-z]+\.)?(archive|security)\.ubuntu\.com|mirrors\.edge\.kernel\.org)/ubuntu/?)#http://$host/ubuntu/#g" /etc/apt/sources.list.d/*.sources
            timeout -k 10 60 $apt update -qq &&
              timeout -k 10 90 $apt install --download-only --no-install-recommends -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross &&
              break
            [ "$attempt" = 6 ] && exit 1
            echo "try $attempt did not finish; trying again"
          done
          mkdir debs
          cp /var/cache/apt/archives/*.deb debs/
          find debs -name '*.deb' | wc -l
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-toolchain
          path: debs
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-qemu
          path: |
            qemu/bin/qemu-aarch64
            qemu/include/qemu-plugin.h
          retention-days: 1
          if-no-files-found: error

  # The same ratchet for AArch64 (D6): built with Ubuntu 24.04's cross gcc 13 and
  # clang 18 `--target=aarch64-linux-gnu`, run under qemu-user 8.2.2, whose plugin
  # counts each call's guest instructions (D343): the toolchain and measure
  # baseline-aarch64.json was blessed on. Emulation makes each configuration
  # slower, so the sources split three ways.
  equivalence-shard-aarch64:
    name: Equivalence aarch64 ${{ matrix.compiler }}-${{ matrix.opt }} ${{ matrix.part.name }}
    runs-on: ubuntu-24.04
    needs: [plan, build, aarch64-toolchain]
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        opt: [O0, O1, O2]
        part:
          - name: a
            sources: tests/corpus/branchy.c tests/corpus/hashes.c
          - name: b
            sources: tests/corpus/values.c tests/gold/flag_materialisation.c tests/gold/review.c tests/gold/manual_limits.c tests/gold/code_pointer_table.c tests/gold/loop_carried.c tests/gold/atomics.c
          - name: shapes
            sources: tests/corpus/shapes.c
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: r2s
          path: target/ci
      - run: chmod +x target/ci/r2s
      - uses: actions/download-artifact@v8
        with:
          name: aarch64-toolchain
          path: debs
      - uses: actions/download-artifact@v8
        with:
          name: aarch64-qemu
          path: qemu
      - name: Install the AArch64 cross toolchain and qemu-user
        run: |
          sudo dpkg -i debs/*.deb
          chmod +x qemu/bin/qemu-aarch64
          ldd qemu/bin/qemu-aarch64
      - name: Print the compilers
        run: |
          aarch64-linux-gnu-gcc --version | head -n 1
          clang --version | head -n 1
          qemu/bin/qemu-aarch64 --version | head -n 1
      - name: Grade the shard
        run: |
          timeout -s ABRT 22m python3 tests/equiv/run_equiv.py \
            --r2s target/ci/r2s \
            --target aarch64 \
            --emulator qemu/bin/qemu-aarch64 \
            --measure instructions \
            --sources ${{ matrix.part.sources }} \
            --compilers ${{ matrix.compiler }} \
            --opts ${{ matrix.opt }} \
            --jobs 4 \
            --out "$RUNNER_TEMP/equiv"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: equiv-aarch64-shard-${{ matrix.compiler }}-${{ matrix.opt }}-${{ matrix.part.name }}
          # The stripped binaries graded, so a moved record can be read locally.
          path: |
            ${{ runner.temp }}/equiv/records.json
            ${{ runner.temp }}/equiv/build/**/shown/*
          retention-days: 7
          if-no-files-found: error

  equivalence-aarch64:
    name: Equivalence Ratchet aarch64
    runs-on: ubuntu-24.04
    needs: [plan, equivalence-shard-aarch64]
    if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: equiv-aarch64-shard-*
          path: ${{ runner.temp }}/shards
      - name: Hold every function to the baseline
        run: |
          python3 tests/equiv/merge_shards.py \
            --baseline tests/equiv/baseline-aarch64.json \
            --out "$RUNNER_TEMP/equiv" \
            "$RUNNER_TEMP"/shards/*/records.json
      - name: Archive the records and the proposed baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: equivalence-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/equiv/records.json
            ${{ runner.temp }}/equiv/baseline.proposed.json
          if-no-files-found: warn

  # D203 on AArch64 (ROADMAP D246): source-gold's scratch-void shapes, cross-built with gcc 13, graded under
  # --target aarch64; build names carry the target qualifier, so known.txt keys never collide with the x86 ones.
  source-gold-aarch64:
    name: Source-Gold Scratch Void aarch64
    runs-on: ubuntu-24.04
    needs: [plan, build, aarch64-toolchain]
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: r2s
          path: target/ci
      - run: chmod +x target/ci/r2s
      - uses: actions/download-artifact@v8
        with:
          name: aarch64-toolchain
          path: debs
      - name: Install the AArch64 cross toolchain
        run: |
          sudo dpkg -i debs/*.deb
          aarch64-linux-gnu-gcc --version | head -n 1
      - name: Grade what each return leaves in the result register
        run: |
          set -eu
          out=target/source-gold-aarch64
          mkdir -p "$out"
          aarch64-linux-gnu-gcc -g -O2 -fstack-protector-strong -o "$out/scratch_debug" tests/gold/source_gold/scratch.c
          aarch64-linux-gnu-gcc -g -O2 -o "$out/returns_debug" tests/gold/source_gold/returns.c
          aarch64-linux-gnu-gcc -g -O2 -o "$out/clones_debug" tests/gold/source_gold/clones.c
          for shape in scratch returns clones; do
            aarch64-linux-gnu-strip -o "$out/${shape}_stripped" "$out/${shape}_debug"
          done
          python3 scripts/scratch_void.py --r2s target/ci/r2s --target aarch64 \
            --build aarch64-scratch "$out/scratch_debug" "$out/scratch_stripped" \
            --build aarch64-returns "$out/returns_debug" "$out/returns_stripped" \
            --build aarch64-clones "$out/clones_debug" "$out/clones_stripped" \
            --known tests/gold/scratch_void/known.txt \
            --baseline tests/gold/scratch_void/ci_baseline_aarch64.json \
            --json "$out/scratch_void.json"

  # ── Whole-binary render coverage ────────────────────────────────────
  #
  # The other gates score nine hand-picked functions and check that what they
  # render is correct. This one asks how much of a binary renders at all, which
  # is the question that went unmeasured while `/bin/ls` halved. It gates on the
  # two programs the repository ships as bytes, reports the compiled cells, and
  # reports whatever the runner has at `/bin/ls` without gating on it, because
  # the runner image decides which program that name points at.
  #
  # macOS, because the compiled cells are built for x86-64 and arm64 with
  # Apple clang's `-arch`, which is what the baseline was blessed with. A
  # different clang reports the compiled cells without gating them.
  coverage:
    name: Whole-Binary Render Coverage
    runs-on: macos-15
    needs: plan
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain the repository pins
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-macos
      - name: Print the compiler
        run: clang --version | head -n 1
      - name: Run coverage sweep
        run: ./tests/coverage/run_coverage.sh
      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/coverage/artifacts/coverage.json
          if-no-files-found: error

  # ── Release build check ────────────────────────────────────────────
  release:
    name: Release Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [quality, capture-gate, diff-r2, source-gold, source-gold-aarch64, equivalence-harness, equivalence, equivalence-aarch64, coverage]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain the repository pins
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build release (all architectures)
        run: cargo build --release --features all-archs
