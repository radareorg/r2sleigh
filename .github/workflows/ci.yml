name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Self-hosted runner optimization: persist incremental build artifacts
  # across jobs/runs to avoid repeatedly recompiling the full workspace.
  CARGO_TARGET_DIR: /tmp/r2sleigh-target

jobs:
  # ── Quality checks (single compile pipeline) ───────────────────────
  quality:
    name: Format + Clippy + Unit Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust PATH
        run: |
          for p in "$HOME/.cargo/bin" "/root/.cargo/bin" "/usr/local/cargo/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
              export PATH="$p:$PATH"
            fi
          done
          if ! command -v cargo &>/dev/null; then
            echo "::error::cargo not found. See scripts/setup-runner.sh"
            exit 1
          fi
      - name: Prepare shared target dir
        run: mkdir -p "$CARGO_TARGET_DIR"
      - name: Print versions
        run: |
          echo "rustc:      $(rustc --version)"
          echo "cargo:      $(cargo --version)"
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Structure (the debt may fall, never rise)
        run: bash scripts/structure-report.sh
      # --no-fail-fast, always: without it cargo stops at the first failing
      # target, so one crate's known failure hides every failure after it.
      - name: Unit tests
        run: cargo test --workspace --all-features --no-fail-fast

  # ── Native certification gate ───────────────────────────────────────
  #
  # Every named function is rendered and the proof is read: a rendering may not
  # read what nothing wrote. radare2 is not run here, which is the point.
  capture-gate:
    name: Native Capture Certification Gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust PATH
        run: |
          for p in "$HOME/.cargo/bin" "/root/.cargo/bin" "/usr/local/cargo/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
              export PATH="$p:$PATH"
            fi
          done
          command -v cargo >/dev/null
      # The binaries are radare2's own test corpus; radare2 itself is not run
      # by this gate, which is the point of it: the native route answers for
      # itself.
      - name: Ensure radare2 checkout for its test binaries
        run: bash .github/scripts/ensure-radare2-ci.sh
      - name: Build the shell
        run: cargo build --release -p r2s --features sleigh
      - name: A rendering may not read what nothing wrote
        run: |
          set -eu
          bins="${R2SLEIGH_RADARE2_CACHE_DIR:-}"
          if [ -z "$bins" ] || [ ! -d "$bins/test/bins/elf" ]; then
            bins="$(ls -d /tmp/radare2-* 2>/dev/null | head -1)"
          fi
          test -d "$bins/test/bins/elf"
          python3 scripts/certify_render.py \
            --bins "$bins/test/bins/elf" \
            --r2s target/release/r2s \
            --limit 12 --functions 8

  # ── Whole-binary render coverage ────────────────────────────────────
  #
  # The other gates score nine hand-picked functions and check that what they
  # render is correct. This one asks how much of a binary renders at all, which
  # is the question that went unmeasured while `/bin/ls` halved. It gates on the
  # two programs the repository ships as bytes, reports the compiled cells, and
  # reports whatever the runner has at `/bin/ls` without gating on it, because
  # the runner image decides which program that name points at.
  coverage:
    name: Whole-Binary Render Coverage
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust PATH
        run: |
          for p in "$HOME/.cargo/bin" "/root/.cargo/bin" "/usr/local/cargo/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
              export PATH="$p:$PATH"
            fi
          done
          command -v cargo >/dev/null
      - name: Ensure radare2 + headers
        run: bash .github/scripts/ensure-radare2-ci.sh
      - name: Run coverage sweep
        run: ./tests/coverage/run_coverage.sh
      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/coverage/artifacts/coverage.json
          if-no-files-found: error

  # ── Release build check ────────────────────────────────────────────
  release:
    name: Release Build
    runs-on: self-hosted
    needs: [quality, capture-gate, coverage]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust PATH
        run: |
          for p in "$HOME/.cargo/bin" "/root/.cargo/bin" "/usr/local/cargo/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
              export PATH="$p:$PATH"
            fi
          done
          if ! command -v cargo &>/dev/null; then
            echo "::error::cargo not found. See scripts/setup-runner.sh"
            exit 1
          fi
      - name: Prepare shared target dir
        run: mkdir -p "$CARGO_TARGET_DIR"
      - name: Ensure radare2 + headers
        run: bash .github/scripts/ensure-radare2-ci.sh

      - name: Build release (all architectures)
        run: cargo build --release --features all-archs
