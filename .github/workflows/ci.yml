name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The jobs read the repository and nothing else: no job writes through the
# token, so it is granted read access to the contents alone.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners: every job starts from a clean image, so nothing here
# depends on a machine someone has to keep alive. A CI build is never edited
# and rebuilt in place, so incremental artifacts are dead weight, and the
# workspace's test build does not fit the runner's disk with debug info on.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # The radare2 test binaries the certification gate reads, at the commit it
  # was last run against: the gate takes the first binaries in name order, so
  # a moving corpus would move the gate.
  TESTBINS_URL: https://github.com/radareorg/radare2-testbins
  TESTBINS_REF: a2a92dc41a06aff40e24cd6a44d372587f01747c
  # A harness that stalls says where: the steps below that drive one run
  # under `timeout -s ABRT`, and the fault handler prints every thread's
  # stack when that signal lands.
  PYTHONFAULTHANDLER: 1

jobs:
  # ── Quality checks (single compile pipeline) ───────────────────────
  quality:
    name: Format + Clippy + Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The image's preinstalled SDKs are not used here, and the workspace's
      # test build needs the room.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
      - name: Install the toolchain the repository pins
        run: rustup toolchain install --profile minimal --component rustfmt,clippy
      # r2rewrite's rule proofs link Z3.
      - name: Install Z3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libz3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Print versions
        run: |
          echo "rustc:      $(rustc --version)"
          echo "cargo:      $(cargo --version)"
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Structure (the debt may fall, never rise)
        run: bash scripts/structure-report.sh
      # --no-fail-fast, always: without it cargo stops at the first failing
      # target, so one crate's known failure hides every failure after it.
      - name: Unit tests
        run: cargo test --workspace --all-features --no-fail-fast

  # ── Native certification gate ───────────────────────────────────────
  #
  # Every named function is rendered and the proof is read: a rendering may not
  # read what nothing wrote. radare2 is not run here, which is the point.
  capture-gate:
    name: Native Capture Certification Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install the toolchain the repository pins
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      # radare2's own test corpus, its ELF directory alone; radare2 itself is
      # not run by this gate.
      - name: Fetch radare2's test binaries
        run: |
          set -eu
          dir="$RUNNER_TEMP/testbins"
          git init -q "$dir"
          git -C "$dir" remote add origin "$TESTBINS_URL"
          git -C "$dir" sparse-checkout set elf
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$TESTBINS_REF"
          git -C "$dir" checkout -q FETCH_HEAD
          test -d "$dir/elf"
      - name: The gate reads the proof line by name
        run: python3 scripts/test_certify_render.py
      # No harness may drive the deleted plugin; the equivalence gate's
      # self-tests must hold before its verdicts mean anything; the DecBench
      # backend files every function it is asked for.
      - name: Harness contracts
        run: |
          python3 -m unittest tests/test_no_plugin.py
          python3 -m unittest discover -s tests/decbench -p 'test_*.py'
          timeout -s ABRT 20m python3 -m unittest discover -s tests/equiv -p 'test_*.py' -v
      - name: Build the shell
        run: cargo build --release -p r2s --features sleigh
      - name: A rendering may not read what nothing wrote
        run: |
          python3 scripts/certify_render.py \
            --bins "$RUNNER_TEMP/testbins/elf" \
            --r2s target/release/r2s \
            --limit 12 --functions 8

  # ── Source-gold: graded against the source, not against another tool ──
  #
  # The same source compiled twice is exact ground truth for free. The debug
  # build says what every function really is and the stripped build is what the
  # engine has to work from, so recovery and soundness are measured rather than
  # asserted. Soundness is the number that matters: a decompiler that guesses
  # confidently is worse than one that says it does not know.
  source-gold:
    name: Source-Gold Correctness Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install the toolchain the repository pins
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build the shell
        run: cargo build --release -p r2s --features sleigh
      - name: Grade the stripped build against the debug build
        run: |
          set -eu
          mkdir -p target/source-gold
          cc -g -O0 -o target/source-gold/debug tests/corpus/hashes.c
          strip -o target/source-gold/stripped target/source-gold/debug
          python3 scripts/differential_truth.py \
            --debug-build target/source-gold/debug \
            --stripped-build target/source-gold/stripped \
            --r2s target/release/r2s \
            --baseline tests/gold/source_gold_baseline.json \
            --json target/source-gold/report.json
      - name: Archive the source-gold report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-gold-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/source-gold/report.json
          if-no-files-found: warn

  # ── Equivalence ratchet ─────────────────────────────────────────────
  #
  # Every function of the corpus and the gold programs is decompiled from its
  # stripped build, compiled, and run against the original on the same inputs,
  # with UBSan and uninitialised-read builds beside it. The baseline holds each
  # function's status and the reason for it exactly: any change -- a function
  # that stops being equal, a refusal that stops producing a record, a failure
  # for a new reason, an improvement not yet blessed -- fails here until the
  # baseline is re-blessed with its cause. The baseline names the compilers it
  # was blessed on (Ubuntu 24.04's gcc 13 and clang 18, which this image
  # carries); another toolchain is refused rather than compared.
  equivalence:
    name: Equivalence Ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install the toolchain the repository pins
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Print the compilers
        run: |
          gcc --version | head -n 1
          clang --version | head -n 1
      # The debug build, as the baseline was blessed with: a `slow` status is
      # a statement about how long a rendering runs.
      - name: Build the shell
        run: cargo build -p r2s --features sleigh
      - name: Hold every function to the baseline
        run: |
          timeout -s ABRT 60m python3 tests/equiv/run_equiv.py \
            --r2s target/debug/r2s \
            --baseline tests/equiv/baseline.json \
            --jobs 4 \
            --out "$RUNNER_TEMP/equiv"
      - name: Archive the records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/equiv/records.json
          if-no-files-found: warn

  # ── Whole-binary render coverage ────────────────────────────────────
  #
  # The other gates score nine hand-picked functions and check that what they
  # render is correct. This one asks how much of a binary renders at all, which
  # is the question that went unmeasured while `/bin/ls` halved. It gates on the
  # two programs the repository ships as bytes, reports the compiled cells, and
  # reports whatever the runner has at `/bin/ls` without gating on it, because
  # the runner image decides which program that name points at.
  #
  # macOS, because the compiled cells are built for x86-64 and arm64 with
  # Apple clang's `-arch`, which is what the baseline was blessed with. A
  # different clang reports the compiled cells without gating them.
  coverage:
    name: Whole-Binary Render Coverage
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install the toolchain the repository pins
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Print the compiler
        run: clang --version | head -n 1
      - name: Run coverage sweep
        run: ./tests/coverage/run_coverage.sh
      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/coverage/artifacts/coverage.json
          if-no-files-found: error

  # ── Release build check ────────────────────────────────────────────
  release:
    name: Release Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [quality, capture-gate, source-gold, equivalence, coverage]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
      - name: Install the toolchain the repository pins
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build release (all architectures)
        run: cargo build --release --features all-archs
