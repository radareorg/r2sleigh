# Disagreements between radare2 and r2s that are judged: who is right, and why
# (ROADMAP P11). `diff_r2.py` fails on any disagreement no entry covers and
# reports an entry nothing matched.
#
# command   the verb (`pd`, `px`, `iS`, `is`, `ie`)
# binaries  a shell pattern over the file name
# r2, r2s   for a listing: regular expressions each tool's line must match
#           (`<missing>` where the tool printed no line); an absent one is any
# values    for a values listing: the values r2s reports and radare2 does not;
#           none listed covers every value of the binaries
# verdict   r2s-right: radare2's defect, an upstream candidate
#           r2-right: r2s's defect, with its owner in the reason
#           unfilled: r2s does not yet state what radare2 does
#           deliberate: r2s spells it otherwise on purpose

[[judged]]
command = "pd"
binaries = "armeb_hello_static"
verdict = "r2s-right"
reason = "e_flags 0x5800202 states BE8: code is little-endian; radare2 decodes it big-endian"

[[judged]]
command = "pd"
binaries = "*"
r2 = '(push|mov r8,|ldr (ip|r0|r3),|lea rsi,) (sym\.__libc_csu_|main$|str\.|loc\.|segment\.)'
r2s = '(push|mov r8,|ldr (ip|r0|r3),|lea rsi,) (0x|\[0x)'
verdict = "deliberate"
reason = "a number is named only where the engine claims it as an address; a pool load is spelled as encoded (listing.rs `held`)"

[[judged]]
command = "pd"
binaries = "_Exit (42)"
r2 = ' ff +invalid$'
r2s = '^<missing>$'
verdict = "r2s-right"
reason = "past the last PT_LOAD (0x8049030) nothing is mapped; radare2 lists its 0xff fill"

[[judged]]
command = "px"
binaries = "_Exit (42)"
r2 = 'ffff ffff ffff ffff'
r2s = '^<missing>$'
verdict = "r2s-right"
reason = "past the last PT_LOAD (0x8049030) nothing is mapped; radare2 dumps its 0xff fill"

