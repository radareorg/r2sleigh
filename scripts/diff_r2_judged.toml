# Disagreements between radare2 and r2s that are judged: who is right, and why
# (ROADMAP P11). `diff_r2.py` fails on any disagreement no entry covers and
# reports an entry nothing matched. The first entry that covers a disagreement
# takes it, so a narrow entry goes before a broad one.
#
# command   the verb (`pd`, `px`, `iS`, `is`, `ie`, `aoj`), or a list of them
# binaries  a shell pattern over the file name, or a list of them
# corpus    the corpus directory's name (`elf`, `mach0`, `pe`); absent is any
# r2, r2s   for a listing: regular expressions each tool's line must match
#           (`<missing>` where the tool printed no line); an absent one is any.
#           For a values listing: `r2s` matches the row r2s prints the value in,
#           `r2` some radare2 row holding the value, each with single spaces
# fill      for a listing: radare2's line is r2s's (or nothing) and then only
#           this byte, as where radare2 fills what is not mapped
# values    for a values listing: the values r2s reports and radare2 does not;
#           none listed covers every value of the binaries
# columns   for a values listing: the columns r2s prints them in
# key       for a values listing: radare2's row with r2s's value in this column
#           holds r2s's value rounded up to an alignment (0x200 to 0x10000)
# fields    for `aoj`: the fields judged: `reads` and `writes` (a register one
#           side names and the other does not), or an instruction-level one:
#           `size` (size or bytes differ), `decode` (the mnemonic differs),
#           `refused` (r2s states no sets, and why), `halted` (radare2's ESIL
#           never reached the memory the IL accesses), `missing`
# registers for `aoj`: the registers judged, exactly; `register` a regular
#           expression over the one judged
# lacking   for `aoj`: the side whose set lacks the register, `r2` or `r2s`
# arch, refused, ours, theirs
#           for `aoj`: regular expressions over the architecture `i` names, r2s's
#           refusal, and r2s's and radare2's whole set, sorted, space-separated;
#           `{register}` in one is the register judged, `{suffix}` it without
#           its first letter. `r2` and `r2s` match each tool's opcode
# verdict   r2s-right: radare2's defect, an upstream candidate
#           r2-right: r2s's defect, with its owner in the reason
#           unfilled: r2s does not yet state what radare2 does
#           deliberate: r2s spells it otherwise on purpose

# The radare2 release every judgment was made against, as an x86-64 host runs
# it (a fat file's slice follows the host); CI installs it, and the harness
# refuses any other (a newer radare2 moves what the judgments match).
radare2 = "6.2.4"

# ── Single binaries, ahead of the classes below that would otherwise take their rows ──

[[judged]]
command = "pd"
binaries = ["arm-*.o", "aarch64-*.o"]
r2 = '\b(blx?|b(eq|ne)?\.w|adrp x\d+,|ldr x\d+,) '
r2s = '\b(blx?|b(eq|ne)?\.w|adrp x\d+,|ldr x\d+,) 0x[0-9a-f]+$'
verdict = "unfilled"
reason = "an ARM or AArch64 object's instruction field (R_ARM_THM_CALL, THM_JUMP19 and JUMP24, BE32 too; R_AARCH64_ADR_GOT_PAGE, LD_PREL_LO19) is stated typed but no encoder writes it, so r2s decodes the file's field: a branch to itself or by its addend (beq.w 0x810003e), an adrp to its own page; owner r2image (ROADMAP I: ARM and AArch64 instruction-field encoders). radare2 also lists the file's field, naming the relocation or the address (bl sym.f is the unrelocated self-target; adrp obj.cbuf names the page after the common symbol it lists at the base)"

