[package]
name = "r2s"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine shell: a radare2-compatible command surface over the r2sleigh engine"

[[bin]]
name = "r2s"
path = "src/main.rs"

[dependencies]
r2engine = { path = "../r2engine" }
r2il = { path = "../r2il" }
r2image = { path = "../r2image" }
clap.workspace = true

[dev-dependencies]
insta.workspace = true
serde_json.workspace = true

[features]
default = []
sleigh = ["r2engine/x86", "r2engine/arm"]

[lints]
workspace = true
