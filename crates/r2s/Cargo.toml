[package]
name = "r2s"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine shell: a radare2-compatible command surface over the r2sleigh engine"

[[bin]]
name = "r2s"
path = "src/main.rs"

[dependencies]
r2engine = { path = "../r2engine" }
r2image = { path = "../r2image" }
r2s-tui = { path = "../r2s-tui" }
clap.workspace = true
reedline.workspace = true
serde_json.workspace = true
mimalloc = { version = "0.1", default-features = false }
# `mi_collect` and `mi_option_set`; pinned because `allocator.rs` names a v3 option by number.
libmimalloc-sys = { version = "=0.1.49", default-features = false, features = ["extended"] }
dhat = { version = "0.3", optional = true }

[dev-dependencies]
r2abi = { path = "../r2abi" }
libtest-mimic.workspace = true
similar.workspace = true
ratatui.workspace = true
crossterm.workspace = true

[features]
default = []
sleigh = ["r2engine/x86", "r2engine/arm", "r2engine/riscv"]
# Count allocations and live bytes in the engine's counters; with R2S_ALLOCATIONS set, print the
# count and the heap peak after a script (the timing gate).
alloc-count = []
placement_mutants = ["r2engine/placement_mutants"]
# Count element visits of function-scale tables; R2S_STATS prints `scans` (the scaling bench, D417).
work-meter = ["r2engine/work-meter"]
# Profile the heap: dhat's allocator; with R2S_HEAP_PROFILE set, a script writes dhat-heap.json (`census.py heap`).
dhat-heap = ["dep:dhat"]

# radare2's r2r format over `tests/db/`, one trial per test (tests/db/README.md).
[[test]]
name = "golden"
path = "tests/golden.rs"
harness = false
required-features = ["sleigh"]

[[test]]
name = "stable_temporaries"
path = "tests/stable_temporaries.rs"
harness = false
required-features = ["sleigh"]

[lints]
workspace = true
