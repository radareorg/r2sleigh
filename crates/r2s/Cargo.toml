[package]
name = "r2s"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine shell: a radare2-compatible command surface over the r2sleigh engine"

[[bin]]
name = "r2s"
path = "src/main.rs"

[dependencies]
r2abi = { path = "../r2abi" }
r2engine = { path = "../r2engine" }
r2image = { path = "../r2image" }
r2sleigh-lift = { path = "../r2sleigh-lift", default-features = false }
r2ssa = { path = "../r2ssa" }
r2il = { path = "../r2il" }
clap.workspace = true
sleigh-config = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

[features]
default = []
sleigh = ["dep:sleigh-config", "r2sleigh-lift/x86", "r2sleigh-lift/arm", "sleigh-config/x86", "sleigh-config/ARM", "sleigh-config/AARCH64"]

[lints]
workspace = true
