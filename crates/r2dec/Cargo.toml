[package]
name = "r2dec"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native decompiler for r2sleigh"

[dependencies]
rustc-hash.workspace = true
r2il = { path = "../r2il" }
r2ssa = { path = "../r2ssa" }
r2rewrite = { path = "../r2rewrite" }
r2types = { path = "../r2types" }
r2source = { path = "../r2source" }
serde.workspace = true

[features]
default = []
# Test only: permute the order a placement writes blocks in (ROADMAP D58).
placement_mutants = []

[dev-dependencies]
r2source = { path = "../r2source", features = ["testing"] }
proptest = "1.12"
serde_json.workspace = true

[lints]
workspace = true
