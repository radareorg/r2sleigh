[package]
name = "r2sleigh-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for compiling Sleigh specs to r2il"

[[bin]]
name = "r2sleigh"
path = "src/main.rs"

[dependencies]
rustc-hash.workspace = true
r2il = { path = "../r2il" }
r2image = { path = "../r2image" }
r2sleigh-lift = { path = "../r2sleigh-lift", default-features = false }
r2ssa = { path = "../r2ssa", optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
clap.workspace = true
hex = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
# Enable specific architecture support for disasm command
sleigh-config = ["dep:sleigh-config", "dep:r2ssa", "dep:serde", "dep:thiserror", "dep:hex", "dep:serde_json"]
decompile = ["sleigh-config"]
x86 = ["decompile", "r2sleigh-lift/x86"]
arm = ["decompile", "r2sleigh-lift/arm"]
mips = ["decompile", "r2sleigh-lift/mips"]
riscv = ["decompile", "r2sleigh-lift/riscv"]
all-archs = ["x86", "arm", "mips", "riscv", "decompile"]

[dependencies.sleigh-config]
workspace = true
optional = true

[lints]
workspace = true
