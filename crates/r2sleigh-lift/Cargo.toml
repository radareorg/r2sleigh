[package]
name = "r2sleigh-lift"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sleigh to r2il translator"

[dependencies]
rustc-hash.workspace = true
r2abi = { path = "../r2abi" }
r2il = { path = "../r2il" }
r2source = { path = "../r2source" }
libsla.workspace = true
thiserror.workspace = true
roxmltree = "0.21"

[dependencies.sleigh-config]
workspace = true
optional = true

[features]
default = []
# The languages each feature reads (`TrustedSleighProfile`, `selection`); only these are compiled.
x86 = ["sleigh-config/sla-x86", "sleigh-config/sla-x86-64"]
arm = ["sleigh-config/sla-ARM8_le", "sleigh-config/sla-ARM8_be", "sleigh-config/sla-AARCH64", "sleigh-config/sla-AARCH64_AppleSilicon"]
mips = [
    "sleigh-config/sla-mips32be",
    "sleigh-config/sla-mips32le",
    "sleigh-config/sla-mips64be",
    "sleigh-config/sla-mips64le",
]
riscv = ["sleigh-config/sla-riscv-ilp32d", "sleigh-config/sla-riscv-lp64d"]

[lints]
workspace = true
