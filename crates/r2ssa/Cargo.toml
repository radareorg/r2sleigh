[package]
name = "r2ssa"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSA (Static Single Assignment) form for r2il"

[dependencies]
rustc-hash.workspace = true
r2il = { path = "../r2il" }
r2sleigh-lift = { path = "../r2sleigh-lift", default-features = false }
r2source = { path = "../r2source" }
serde.workspace = true
petgraph = "0.8"

[features]
default = []
# Test only: state the boundary facts unsoundly, so a reader's guard is shown to hold alone (ROADMAP D68).
fact_mutants = []
sleigh-config = ["dep:sleigh-config", "r2sleigh-lift/x86"]

[dev-dependencies]
r2source = { path = "../r2source", features = ["testing"] }
proptest = "1.12"
r2sleigh-lift = { path = "../r2sleigh-lift", default-features = false, features = ["x86", "arm"] }
serde_json.workspace = true

[dependencies.sleigh-config]
workspace = true
optional = true

[lints]
workspace = true
