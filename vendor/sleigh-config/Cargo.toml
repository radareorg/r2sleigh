[package]
name = "sleigh-config"
version = "1.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mnemonikr/sleigh-config"
description = "Precompiled .sla files and other processor configuration files needed to interface with Ghidra SLEIGH"
categories = ["security", "config", "caching"]
include = [
    "/build.rs",
    "/src/*",
    "/ghidra/Ghidra/Processors/*/data/languages/*",
    "/ghidra/DISCLAIMER.md",
    "/ghidra/NOTICE",
    "/ghidra/LICENSE",
    "/ghidra/licenses/*",
]

[dependencies]

[build-dependencies]
heck = "0.5"
sleigh-compiler = { version = "2.0" }

[features]
# One per vendored `.slaspec` (`x86-64.slaspec` is `sla-x86-64`); r2sleigh-lift's
# features choose which are compiled and embedded (vendor/README.md).
sla-AARCH64 = []
sla-AARCH64BE = []
sla-AARCH64_AppleSilicon = []
sla-ARM4_be = []
sla-ARM4_le = []
sla-ARM4t_be = []
sla-ARM4t_le = []
sla-ARM5_be = []
sla-ARM5_le = []
sla-ARM5t_be = []
sla-ARM5t_le = []
sla-ARM6_be = []
sla-ARM6_le = []
sla-ARM7_be = []
sla-ARM7_le = []
sla-ARM8_be = []
sla-ARM8_le = []
sla-ARM8m_be = []
sla-ARM8m_le = []
sla-andestar_v5 = []
sla-mips32R6be = []
sla-mips32R6le = []
sla-mips32be = []
sla-mips32le = []
sla-mips64be = []
sla-mips64le = []
sla-riscv-ilp32d = []
sla-riscv-lp64d = []
sla-x86 = []
sla-x86-64 = []
